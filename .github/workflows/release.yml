name: Release to NuGet

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
      - name: Build
        run: dotnet build -c Release
      - name: Pack nugets
        run: dotnet pack -c Release --no-build --output .