name: Release to NuGet

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write  # enable GitHub OIDC token issuance for this job
  
env:
  project_path: SqlBulkCopyHelper/SqlBulkCopyHelper.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Setup .Net
        uses: actions/setup-dotnet@v5
        
      - name: Restore
        run: dotnet restore ${{ env.project_path }}
        
      - name: Build
        run: dotnet build ${{ env.project_path }} --configuration Release --no-restore
        
      - name: Pack
        run: dotnet pack ${{ env.project_path }} --configuration Release --no-build --output out /p:PackageVersion=${{ github.event.release.tag_name }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          
      - name: NuGet push
        run: dotnet nuget push out/* --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
        
      - name: Upload nuget to release
        run: gh release upload ${{ github.event.release.tag_name }} out/*
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash